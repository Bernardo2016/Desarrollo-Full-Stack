<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Donaciones Recibidas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="fw-bold mb-4">Registro de Donaciones (MongoDB)</h2>
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID Transacción</th>
                        <th>Donante / Empresa</th>
                        <th>Causa</th>
                        <th>Monto</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody id="tabla-body">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Al cargar la página, obtener los datos de la API
    window.onload = async () => {
        try {
            const respuesta = await fetch('http://localhost:3000/api/donaciones');
            const donaciones = await respuesta.json();
            
            const tbody = document.getElementById('tabla-body');
            
            if(donaciones.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center">No hay donaciones registradas aún.</td></tr>';
                return;
            }

            donaciones.forEach(don => {
                const fila = `
                    <tr>
                        <td><span class="badge bg-secondary">${don.transaccion.id_pago}</span></td>
                        <td>${don.donante.nombre}</td>
                        <td>${don.transaccion.causa}</td>
                        <td class="text-success fw-bold">$${don.transaccion.monto}</td>
                        <td>${new Date(don.createdAt).toLocaleDateString()}</td>
                    </tr>
                `;
                tbody.innerHTML += fila;
            });
        } catch (error) {
            console.error("Error cargando dashboard:", error);
            document.getElementById('tabla-body').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Error conectando con la API. Verifica que Node.js esté corriendo.</td></tr>';
        }
    }
</script>
</body>
</html>
